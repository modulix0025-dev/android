# CI for modulex-translator/: builds the APKs, runs JVM + host-native + emulator tests, evaluates
# the real translation and speech models, and builds the signaling relay image.
name: ModuleX Translator

on:
  push:
    branches: ['claude/**', 'main', 'master']
    paths: ['modulex-translator/**', '.github/workflows/modulex-translator.yml']
  workflow_dispatch:
    inputs:
      gguf_file:
        description: 'GGUF file in tencent/Hy-MT2-1.8B-GGUF (blank: auto-select Q4_K_M)'
        required: false
        default: ''

permissions:
  contents: read

# One run per commit: a newer push must not cancel a long real-model evaluation already running.
concurrency:
  group: modulex-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1

defaults:
  run:
    working-directory: modulex-translator

jobs:
  jvm-and-host-native:
    name: JVM and host-native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Host build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3-numpy
      - name: Cache native sources
        uses: actions/cache@v4
        with:
          path: modulex-translator/third_party
          key: native-src-${{ hashFiles('modulex-translator/tools/fetch-native-deps.sh') }}
      - run: tools/fetch-native-deps.sh
      - run: mkdir -p build && set -o pipefail && ./gradlew :core:test :engines:test :signaling:test --console=plain 2>&1 | tee build/ci-jvm.log
      - name: Error summary
        if: failure()
        run: |
          for f in build/ci-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by|> Could not|AAPT|Lint found|ERROR" "$f" | grep -v "cmTC_" | head -80
            grep -A25 "What went wrong" "$f" | head -60
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          path: modulex-translator/*/build/test-results/test/*.xml

  android:
    name: Android APKs, unit tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Cache native sources
        uses: actions/cache@v4
        with:
          path: modulex-translator/third_party
          key: native-src-${{ hashFiles('modulex-translator/tools/fetch-native-deps.sh') }}
      - run: tools/fetch-native-deps.sh
      - name: Build
        run: mkdir -p build && set -o pipefail && ./gradlew --continue :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --console=plain 2>&1 | tee build/ci-android.log
      - name: Error summary
        if: failure()
        run: |
          for f in build/ci-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by|> Could not|AAPT|Lint found|ERROR" "$f" | grep -v "cmTC_" | head -80
            grep -A25 "What went wrong" "$f" | head -60
          done
      - name: Verify native libraries (exports, no networking imports, 16 KB alignment)
        run: |
          NM="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          mkdir -p build/apkcheck && cd build/apkcheck
          unzip -oq ../../app/build/outputs/apk/debug/app-debug.apk 'lib/*'
          fail=0
          for so in lib/arm64-v8a/libmx_*.so; do
            echo "== $so ($(stat -c %s "$so") bytes)"
            "$NM" -D --defined-only "$so" | awk '{print $3}' | grep -v '^Java_\|^JNI_On' && { echo "unexpected export"; fail=1; }
            if "$NM" -D --undefined-only "$so" | awk '{print $2}' | grep -wE 'socket|connect|getaddrinfo|gethostbyname|send|recv'; then echo "networking import"; fail=1; fi
          done
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 ../../app/build/outputs/apk/debug/app-debug.apk | tail -1
          exit $fail
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            modulex-translator/app/build/outputs/apk/debug/*.apk
            modulex-translator/app/build/outputs/apk/release/*.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            modulex-translator/app/build/reports/
            modulex-translator/app/build/test-results/

  emulator:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # only used to commit screenshots back to this branch (see the last step)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Cache native sources
        uses: actions/cache@v4
        with:
          path: modulex-translator/third_party
          key: native-src-${{ hashFiles('modulex-translator/tools/fetch-native-deps.sh') }}
      - run: tools/fetch-native-deps.sh
      - name: Build app and test APKs (arm64 + x86_64)
        run: mkdir -p build && set -o pipefail && ./gradlew --continue :app:assembleDebug :app:assembleDebugAndroidTest -Pmodulex.abis=arm64-v8a,x86_64 --console=plain 2>&1 | tee build/ci-emulator.log
      - name: Error summary
        if: failure()
        run: |
          for f in build/ci-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by|> Could not|AAPT|Lint found|ERROR" "$f" | grep -v "cmTC_" | head -80
            grep -A25 "What went wrong" "$f" | head -60
          done
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          working-directory: modulex-translator
          # 1) Screenshot tour of every screen (EN/AR, light/dark) for UI review; 2) the instrumentation tests.
          script: |
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1200
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.modulex.translator.ScreenshotTour com.modulex.translator.debug.test/androidx.test.runner.AndroidJUnitRunner | tail -20
            mkdir -p build && adb pull /sdcard/Android/data/com.modulex.translator.debug/files/screenshots build/screenshots
            cat build/screenshots/errors.txt || true
            ./gradlew :app:connectedDebugAndroidTest -Pmodulex.abis=arm64-v8a,x86_64 -Pandroid.testInstrumentationRunnerArguments.notClass=com.modulex.translator.ScreenshotTour --console=plain
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: modulex-translator/build/screenshots/
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-results
          path: modulex-translator/app/build/outputs/androidTest-results/
      # Commits downscaled screenshots to docs/screenshots on this branch, only when the pushed
      # commit message contains [screenshots], so they can be reviewed without downloading artifacts.
      - name: Publish screenshots to the branch
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[screenshots]')
        run: |
          ls build/screenshots/*.png > /dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          command -v convert > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q imagemagick; }
          dest=docs/screenshots
          rm -rf "$dest" && mkdir -p "$dest"
          for f in build/screenshots/*.png; do convert "$f" -resize 720x -quality 85 "$dest/$(basename "${f%.png}").jpg"; done
          cp build/screenshots/errors.txt "$dest/" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git commit -qm "UI screenshots from CI run ${{ github.run_id }} (emulator, EN/AR, light/dark)" || exit 0
          for i in 1 2 3; do
            git fetch -q origin "${{ github.ref_name }}" && git rebase -q FETCH_HEAD && git push -q origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          exit 1

  # Publishes test builds as a pre-release with stable download URLs, when the pushed commit message
  # contains [release-apk] or the workflow is started by hand:
  #   ModuleX-Translator-debug.apk       "full": every pinned pack (translation, speech, all OCR
  #                                      languages) inside the APK, verified against its pin
  #   ModuleX-Translator-lite-debug.apk  packs are downloaded inside the app
  publish-apk:
    name: Publish debug APKs (full and lite)
    needs: android
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-apk]')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Cache native sources
        uses: actions/cache@v4
        with:
          path: modulex-translator/third_party
          key: native-src-${{ hashFiles('modulex-translator/tools/fetch-native-deps.sh') }}
      - run: tools/fetch-native-deps.sh
      - name: Download and verify every pinned pack
        run: python3 tools/fetch_bundled_models.py --dest "$RUNNER_TEMP/bundle"
      - name: Build the full APK
        run: |
          mkdir -p build && set -o pipefail
          ./gradlew :app:assembleDebug -Pmodulex.bundledModels="$RUNNER_TEMP/bundle" --console=plain 2>&1 | tee build/ci-full.log
          ls -la app/build/outputs/apk/debug/
      - uses: actions/download-artifact@v4
        with: { name: apks, path: lite }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ModuleX-Translator-debug.apk
          cp "$(find lite -name app-debug.apk | head -1)" ModuleX-Translator-lite-debug.apk
          sha256sum ModuleX-Translator-debug.apk ModuleX-Translator-lite-debug.apk | tee SHA256SUMS
          full_mb=$(( $(stat -c %s ModuleX-Translator-debug.apk) / 1048576 ))
          lite_mb=$(( $(stat -c %s ModuleX-Translator-lite-debug.apk) / 1048576 ))
          cat > notes.md <<EOF
          Test builds of ModuleX Translator from commit ${GITHUB_SHA::8} (CI run ${GITHUB_RUN_ID}).

          - ModuleX-Translator-debug.apk (${full_mb} MB): everything needed offline is inside the APK —
            translation model, speech recognition model(s) and text recognition for every listed
            language. On first start the app copies them into place and checks each file's SHA-256;
            needs about twice the APK size of free storage at that moment.
          - ModuleX-Translator-lite-debug.apk (${lite_mb} MB): the same app; packs are downloaded in the app.
          - Debug builds signed with the CI debug key, for testing (not store distribution).
          - Android 10+ (API 29), 64-bit ARM phones. Offline translation needs ARMv8.2 dot-product support.
          - Not yet validated on a physical device.
          EOF
          gh release delete modulex-translator-debug --yes --cleanup-tag || true
          gh release create modulex-translator-debug ModuleX-Translator-debug.apk ModuleX-Translator-lite-debug.apk SHA256SUMS \
            --prerelease --target "$GITHUB_SHA" --title "ModuleX Translator (debug test builds)" --notes-file notes.md
      - name: Error summary
        if: failure()
        run: |
          grep -nE "^e: |error:|FAILED|What went wrong|OutOfMemory" build/ci-full.log | head -60 || true

  model-eval:
    name: Real models (download, verify, pin, translate, transcribe)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build python3-numpy
          python3 -m pip install --user --break-system-packages "huggingface_hub>=0.25"
      - name: Cache native sources
        uses: actions/cache@v4
        with:
          path: modulex-translator/third_party
          key: native-src-${{ hashFiles('modulex-translator/tools/fetch-native-deps.sh') }}
      - run: tools/fetch-native-deps.sh
      - name: Download and verify models
        run: python3 tools/ci_fetch_models.py --dest "$RUNNER_TEMP/models" --out "$RUNNER_TEMP/pins.json" --gguf-file "${{ github.event.inputs.gguf_file }}"
      - name: GGUF compatibility with the pinned llama.cpp
        run: python3 tools/check_gguf.py third_party/llama.cpp/gguf-py "$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/pins.json'))['translation']['path'])")"
      - name: Translation corpus and speech sample with the real models
        run: |
          mkdir -p build && set -o pipefail
          MODEL=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/pins.json'))['translation']['path'])")
          SPEECH=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/pins.json'))['speech']['path'])")
          ./gradlew :engines:test --console=plain \
            --tests '*TranslationEngineTest.realModelTranslatesCorpus' --tests '*SpeechEngineTest.realModelTranscribesSample' \
            -Pmodulex.testModel="$MODEL" -Pmodulex.testSpeechModel="$SPEECH" 2>&1 | tee build/ci-model.log
      - name: Error summary
        if: failure()
        run: |
          for f in build/ci-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by|> Could not|AAPT|Lint found|ERROR" "$f" | grep -v "cmTC_" | head -80
            grep -A25 "What went wrong" "$f" | head -60
          done
      - name: Model results
        if: always()
        run: |
          echo "===== pins"; cat "$RUNNER_TEMP/pins.json" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(k, json.dumps({x:v[x] for x in v if x!='path'})) for k,v in d.items()]" || true
          echo "===== test output"
          for f in engines/build/test-results/test/*.xml; do python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          for tc in r.findall("testcase"):
              st = "FAILED" if tc.find("failure") is not None else ("SKIPPED" if tc.find("skipped") is not None else "PASSED")
              print(r.get("name").split(".")[-1], tc.get("name"), st)
              f = tc.find("failure")
              if f is not None: print((f.get("message") or "")[:2000])
          so = r.find("system-out")
          if so is not None and so.text: print(so.text[-12000:])
          PY
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-eval
          path: |
            ${{ runner.temp }}/pins.json
            modulex-translator/engines/build/test-results/test/*.xml

  signaling-image:
    name: Signaling relay Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f signaling/Dockerfile -t modulex-signaling:ci .
      - name: Smoke test the container
        run: |
          docker run -d --rm -p 8080:8080 --name sig modulex-signaling:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          docker stop sig
